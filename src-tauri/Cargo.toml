cargo-features = ["profile-rustflags", "trim-paths"]

[build-dependencies.tauri-build]
features = []
version = "2"

[dependencies]
anyhow = "1"
chrono = "0.4"
encoding_rs = "0.8"
env_logger = "0.11"
log = "0.4"
probe-rs = "0.31"
rand = "0.10"
serde_json = "1"

[dependencies.regex]
features = ["perf", "std"]
version = "1"

[dependencies.serde]
features = ["derive"]
version = "1"

[dependencies.tauri]
features = ["config-toml"]
version = "2"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "metadata_editor_lib"

[package]
authors = ["Sora Tonami <ms0503@outlook.com>"]
description = "Edit metadata of circuit made by Mechatronics Lab"
edition = "2024"
name = "metadata-editor"
resolver = "3"
version = "0.1.0"

[profile.dev]
incremental = true
rustflags = ["-Zthreads=16"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
rustflags = ["-Cdebuginfo=0", "-Zthreads=16"]
strip = true
trim-paths = "all"
