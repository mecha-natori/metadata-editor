cargo-features = ["profile-rustflags", "trim-paths"]

[build-dependencies.tauri-build]
features = []
version = "2"

[dependencies]
anyhow = "1"
env_logger = "0.11"
log = "0.4"
probe-rs = "0.32"
tauri-plugin-dialog = "=2.8.1"

[dependencies.serde]
features = ["derive"]
version = "1"

[dependencies.store]
path = "../crates/store"

[dependencies.tauri]
features = ["config-toml"]
version = "=2.12.2"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "metadata_editor_lib"

[package]
description = "Edit metadata of circuit made by Mechatronics Lab"
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "metadata-editor"
repository.workspace = true
resolver = "3"
version.workspace = true

[profile.dev]
incremental = true
rustflags = ["-Zthreads=16"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
rustflags = ["-Cdebuginfo=0", "-Zthreads=16"]
strip = true
trim-paths = "all"
