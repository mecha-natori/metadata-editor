allowBuilds:
  core-js-pure: true
catalog:
  oxfmt: '^0.72.0'
  oxlint: '^1.87.0'
  oxlint-tsgolint: '^7.0.2005'
catalogs:
  minimatch11:
    minimatch: '^11.0.3'
  ts6:
    typescript: 'npm:@typescript/typescript6@^6.0.2'
minimumReleaseAge: 10080
overrides:
  '@eslint/config-array>minimatch': 'catalog:minimatch11'
  '@jsr/ms0503__oxc-config>oxfmt': 'catalog:'
  '@jsr/ms0503__oxc-config>oxlint': 'catalog:'
  '@jsr/ms0503__oxc-config>oxlint-tsgolint': 'catalog:'
  '@typescript-eslint/project-service>typescript': 'catalog:ts6'
  '@typescript-eslint/tsconfig-utils>typescript': 'catalog:ts6'
  '@typescript-eslint/typescript-estree>minimatch': 'catalog:minimatch11'
  '@typescript-eslint/typescript-estree>typescript': 'catalog:ts6'
  '@typescript-eslint/utils>typescript': 'catalog:ts6'
  'eslint>minimatch': 'catalog:minimatch11'
  'glob>minimatch': 'catalog:minimatch11'
peerDependencyRules:
  allowedVersions:
    typescript: '7'
