description: 'Builds the metadata-editor project for RedHat Enterprise Linux family'
inputs:
  gpg-private-key:
    description: 'GPG private key for signing'
    required: true
  gpg-private-key-passphrase:
    description: 'Passphrase of GPG private key for signing'
    required: true
  gpg-sign-key:
    description: 'GPG key id for signing'
    required: true
name: 'Build for RedHat Enterprise Linux family'
outputs:
  version:
    description: 'App version'
    value: '${{ steps.version.outputs.value }}'
runs:
  steps:
    - env:
        GPG_PRIVATE_KEY: '${{ inputs.gpg-private-key }}'
        GPG_PRIVATE_KEY_PASSPHRASE: '${{ inputs.gpg-private-key-passphrase }}'
      name: 'Import GPG key'
      shell: 'bash'
      run: |
        gpg \
          --batch \
          --import \
          --no-tty \
          --passphrase-fd 3 \
          --pinentry-mode loopback \
          --yes \
          <<<"$GPG_PRIVATE_KEY" \
          3<<<"$GPG_PRIVATE_KEY_PASSPHRASE"
    - name: 'Install Tauri dependencies and tools'
      shell: 'bash'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends --no-install-suggests \
          libappindicator3-dev \
          libgtk-3-dev \
          librsvg2-dev \
          libwebkit2gtk-4.1-dev \
          mold \
          rpm
    - env:
        GPG_SIGN_KEY: '${{ inputs.gpg-sign-key }}'
      name: 'Setup rpmsign'
      shell: 'bash'
      run: |
        touch ~/.rpmmacros
        printf "%%_signature gpg\n" >>~/.rpmmacros
        printf "%%_gpg_name %s\n" "$GPG_SIGN_KEY" >>~/.rpmmacros
        printf "%%__gpg_sign_cmd %%{__gpg} gpg" >>~/.rpmmacros
        printf " --batch" >>~/.rpmmacros
        printf " --detach-sign" >>~/.rpmmacros
        printf " --force-v3-sigs" >>~/.rpmmacros
        printf " --local-user \"%%{_gpg_name}\"" >>~/.rpmmacros
        printf " --no-armor" >>~/.rpmmacros
        printf " --no-secmem-warning" >>~/.rpmmacros
        printf " --no-tty" >>~/.rpmmacros
        printf " --output \"%%{__signature_filename}\"" >>~/.rpmmacros
        printf " --passphrase-file /tmp/gpg_passphrase" >>~/.rpmmacros
        printf " --pinentry-mode loopback" >>~/.rpmmacros
        printf " --yes" >>~/.rpmmacros
        printf " \"%%{__plaintext_filename}\"\n" >>~/.rpmmacros
    - name: 'Install pnpm'
      uses: 'pnpm/action-setup@v6.1.1'
    - name: 'Setup Node.js'
      uses: 'actions/setup-node@v7.1.0'
      with:
        cache: 'pnpm'
        node-version: 26
    - name: 'Setup latest Rust toolchain'
      uses: 'dtolnay/rust-toolchain@nightly'
      with:
        targets: 'x86_64-unknown-linux-gnu'
    - name: 'Install frontend dependencies'
      shell: 'bash'
      run: 'pnpm ci'
    - name: 'Install backend dependencies'
      shell: 'bash'
      run: 'cargo fetch'
    - id: 'product-name'
      name: 'Get product name'
      uses: 'SebRollen/toml-action@v1.2.0'
      with:
        field: 'productName'
        file: 'src-tauri/Tauri.toml'
    - id: 'version'
      name: 'Get version'
      uses: 'SebRollen/toml-action@v1.2.0'
      with:
        field: 'workspace.package.version'
        file: 'Cargo.toml'
    - env:
        GPG_PRIVATE_KEY_PASSPHRASE: '${{ inputs.gpg-private-key-passphrase }}'
        GPG_SIGN_KEY: '${{ inputs.gpg-sign-key }}'
        RUSTFLAGS: '-Clink-arg=-fuse-ld=mold'
      id: 'build'
      name: 'Build'
      shell: 'bash'
      run: |
        pnpm tauri build -b rpm --no-sign
        dir=$PWD/target/release/bundle/rpm
        name="${{ steps.product-name.outputs.value }}"
        ver="${{ steps.version.outputs.value }}"
        fullname=${name}-${ver}-1.x86_64
        if [[ ! -f $dir/$fullname.rpm ]]; then
          file=$(find "$dir" -type f -name '*.rpm')
          printf "\e[1;31mError: installer file name is wrong\e[m\n"
          printf "  expected: \e[33m%s/%s.rpm\e[m\n" "$dir" "$fullname"
          printf "  found: \e[33m%s\e[m\n" "$file"
          exit 1
        fi
        mkdir out
        mv "$dir/$fullname.rpm" "$GITHUB_WORKSPACE/out/$fullname.rpm"
        touch /tmp/gpg_passphrase
        chmod 0600 /tmp/gpg_passphrase
        printf "%s" "$GPG_PRIVATE_KEY_PASSPHRASE" /tmp/gpg_passphrase
        rpmsign --addsign "$GITHUB_WORKSPACE/out/$fullname.rpm"
        rm -f /tmp/gpg_passphrase
  using: 'composite'
