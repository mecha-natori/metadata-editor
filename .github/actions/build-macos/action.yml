description: 'Builds the metadata-editor project for macOS (Universal)'
inputs:
  tauri-private-key:
    description: 'Tauri private key for signing'
    required: true
name: 'Build for macOS'
outputs:
  version:
    description: 'App version'
    value: '${{ steps.version.outputs.value }}'
runs:
  steps:
    - name: 'Install pnpm'
      uses: 'pnpm/action-setup@v6.1.1'
    - name: 'Setup Node.js'
      uses: 'actions/setup-node@v7.1.0'
      with:
        cache: 'pnpm'
        node-version: 26
    - name: 'Setup latest Rust toolchain'
      uses: 'dtolnay/rust-toolchain@nightly'
      with:
        targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    - name: 'Install frontend dependencies'
      shell: 'bash'
      run: 'pnpm ci'
    - name: 'Install backend dependencies'
      shell: 'bash'
      run: 'cargo fetch'
    - id: 'product-name'
      name: 'Get product name'
      uses: 'SebRollen/toml-action@v1.2.0'
      with:
        field: 'productName'
        file: 'src-tauri/Tauri.toml'
    - id: 'version'
      name: 'Get version'
      uses: 'SebRollen/toml-action@v1.2.0'
      with:
        field: 'workspace.package.version'
        file: 'Cargo.toml'
    - env:
        TAURI_SIGNING_PRIVATE_KEY: '${{ inputs.tauri-private-key }}'
      id: 'build'
      name: 'Build'
      shell: 'bash'
      run: |
        pnpm tauri build -b dmg -t universal-apple-darwin
        dmg_dir=$PWD/target/universal-apple-darwin/release/bundle/dmg
        updater_dir=$PWD/target/universal-apple-darwin/release/bundle/macos
        name="${{ steps.product-name.outputs.value }}"
        ver="${{ steps.version.outputs.value }}"
        dmg_name=${name}_${ver}_universal
        if [[ ! -f $dmg_dir/$dmg_name.dmg ]]; then
          file=$(find "$dmg_dir" -type f -name '*.dmg')
          printf "\e[1;31mError: installer file name is wrong\e[m\n"
          printf "  expected: \e[33m%s/%s.dmg\e[m\n" "$dmg_dir" "$dmg_name"
          printf "  found: \e[33m%s\e[m\n" "$file"
          exit 1
        fi
        if [[ ! -f $updater_dir/$name.app.tar.gz ]]; then
          file=$(find "$updater_dir" -type f -name '*.app.tar.gz')
          printf "\e[1;31mError: updater file name is wrong\e[m\n"
          printf "  expected: \e[33m%s/%s.app.tar.gz\e[m\n" \
            "$updater_dir" \
            "$name"
          printf "  found: \e[33m%s\e[m\n" "$file"
          exit 1
        fi
        mkdir out
        mv "$dmg_dir/$dmg_name.dmg" "$GITHUB_WORKSPACE/out/$dmg_name.dmg"
        mv \
          "$updater_dir/$name.app.tar.gz" \
          "$GITHUB_WORKSPACE/out/$name.app.tar.gz"
        mv \
          "$updater_dir/$name.app.tar.gz.sig" \
          "$GITHUB_WORKSPACE/out/$name.app.tar.gz.sig"
  using: 'composite'
