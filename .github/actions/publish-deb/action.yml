description: 'Publishes the metadata-editor package for Debian GNU/Linux family to repository'
inputs:
  file:
    description: 'Path to file to publish'
    required: true
  gpg-private-key:
    description: 'GPG private key for signing'
    required: true
  gpg-private-key-passphrase:
    description: 'Passphrase of GPG private key for signing'
    required: true
  gpg-public-key:
    description: 'GPG public key for signing'
    required: true
  gpg-sign-key:
    description: 'GPG key id for signing'
    required: true
  website-repo:
    description: 'Path to cloned website repository'
    required: true
name: 'Publish for Debian GNU/Linux family to repository'
runs:
  steps:
    - name: 'Install tools'
      shell: 'bash'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends --no-install-suggests \
          apt-utils \
          dpkg-dev
    - env:
        GPG_PRIVATE_KEY: '${{ inputs.gpg-private-key }}'
        GPG_PRIVATE_KEY_PASSPHRASE: '${{ inputs.gpg-private-key-passphrase }}'
        GPG_PUBLIC_KEY: '${{ inputs.gpg-public-key }}'
      name: 'Import GPG key'
      shell: 'bash'
      run: |
        gpg \
          --batch \
          --keyserver keyserver.ubuntu.com \
          --no-tty \
          --recv-keys "$GPG_PUBLIC_KEY" \
          --yes
        gpg \
          --batch \
          --import \
          --no-tty \
          --passphrase-fd 3 \
          --pinentry-mode loopback \
          --yes \
          <<<"$GPG_PRIVATE_KEY" \
          3<<<"$GPG_PRIVATE_KEY_PASSPHRASE"
    - env:
        FILE: '${{ inputs.file }}'
        GPG_PRIVATE_KEY_PASSPHRASE: '${{ inputs.gpg-private-key-passphrase }}'
        GPG_PUBLIC_KEY: '${{ inputs.gpg-public-key }}'
        GPG_SIGN_KEY: '${{ inputs.gpg-sign-key }}'
        WEBSITE_REPO: '${{ inputs.website-repo }}'
      name: 'Update repository'
      shell: 'bash'
      run: |
        cd "$GITHUB_WORKSPACE/$WEBSITE_REPO/src"
        mkdir -p repo/deb
        cd repo/deb
        mkdir -p pool/main
        cp "$GITHUB_WORKSPACE/$FILE" pool/main/
        dpkg-scanpackages --multiversion pool/ >Packages
        gzip -k -f Packages
        apt-ftparchive release . >Release
        gpg \
          --armor \
          --batch \
          --detach-sign \
          --local-user "$GPG_SIGN_KEY" \
          --no-tty \
          --output Release.gpg \
          --passphrase-fd 0 \
          --pinentry-mode loopback \
          --yes \
          Release \
          <<<"$GPG_PRIVATE_KEY_PASSPHRASE"
        gpg \
          --batch \
          --clear-sign \
          --local-user "$GPG_SIGN_KEY" \
          --no-tty \
          --output InRelease \
          --passphrase-fd 0 \
          --pinentry-mode loopback \
          --yes \
          Release \
          <<<"$GPG_PRIVATE_KEY_PASSPHRASE"
        gpg \
          --armor \
          --batch \
          --export "$GPG_PUBLIC_KEY" \
          --no-tty \
          --output mecha-natori.gpg.key \
          --yes
  using: 'composite'
